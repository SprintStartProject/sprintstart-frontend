<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #faf8ef;
        color: #776e65;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        font-size: 18px;
      }

      body {
        margin: 20px 0;
        zoom: 1.38;
      }

      .heading {
        display: flex;
        width: 100%;
      }

      .scores-container {
        display: flex;
        width: 100%;
        gap: 8px;
      }

      .score-container,
      .best-container {
        flex: 1;
      }

      @keyframes move-up {
        0% {
          top: 25px;
          opacity: 1;
        }

        100% {
          top: -50px;
          opacity: 0;
        }
      }
      .scores-container {
        display: flex;
        width: 100%;
        gap: 8px;
      }

      .score-container,
      .best-container {
        position: relative;
        display: inline-block;
        background: #bbada0;
        padding: 15px 25px;
        font-size: 25px;
        height: 25px;
        line-height: 47px;
        font-weight: bold;
        border-radius: 3px;
        color: white;
        margin-top: 8px;
        text-align: center;
      }
      .score-container:after,
      .best-container:after {
        position: absolute;
        width: 100%;
        top: 10px;
        left: 0;
        text-transform: uppercase;
        font-size: 13px;
        line-height: 13px;
        text-align: center;
        color: #eee4da;
      }
      .score-container .score-addition,
      .best-container .score-addition {
        position: absolute;
        right: 30px;
        color: red;
        font-size: 25px;
        line-height: 25px;
        font-weight: bold;
        color: rgba(119, 110, 101, 0.9);
        z-index: 100;
        animation: move-up 600ms ease-in;
        animation-fill-mode: both;
      }

      .score-container:after {
        content: "Score";
      }

      .best-container:after {
        content: "Best";
      }

      p {
        margin-top: 0;
        margin-bottom: 10px;
        line-height: 1.65;
      }

      a {
        color: #776e65;
        font-weight: bold;
        text-decoration: underline;
        cursor: pointer;
      }

      /* Visible keyboard focus for the game's <a role="button"> controls */
      a.restart-button:focus-visible,
      .game-message a:focus-visible {
        outline: 3px solid #f67c5f;
        outline-offset: 2px;
        border-radius: 3px;
      }

      strong.important {
        text-transform: uppercase;
      }

      hr {
        border: none;
        border-bottom: 1px solid #d8d4d0;
        margin-top: 20px;
        margin-bottom: 30px;
      }

      .container {
        width: 500px;
        margin: 0 auto;
      }

      @keyframes fade-in {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }
      .game-container {
        margin-top: 40px;
        position: relative;
        padding: 15px;
        cursor: default;
        touch-action: none;
        background: #bbada0;
        border-radius: 6px;
        width: 500px;
        height: 500px;
        box-sizing: border-box;
      }
      .game-container .game-message {
        display: none;
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: rgba(238, 228, 218, 0.5);
        z-index: 100;
        text-align: center;
        animation: fade-in 800ms ease 1200ms;
        animation-fill-mode: both;
      }
      .game-container .game-message p {
        font-size: 60px;
        font-weight: bold;
        height: 60px;
        line-height: 60px;
        margin-top: 222px;
      }
      .game-container .game-message .lower {
        display: block;
        margin-top: 59px;
      }
      .game-container .game-message a {
        display: inline-block;
        background: #8f7a66;
        border-radius: 3px;
        padding: 0 20px;
        text-decoration: none;
        color: #f9f6f2;
        height: 40px;
        line-height: 42px;
        margin-left: 9px;
      }
      .game-container .game-message a.keep-playing-button {
        display: none;
      }
      .game-container .game-message.game-won {
        background: rgba(237, 194, 46, 0.5);
        color: #f9f6f2;
      }
      .game-container .game-message.game-won a.keep-playing-button {
        display: inline-block;
      }
      .game-container .game-message.game-won,

      }

        position: absolute;
        z-index: 1;
      }

      .grid-row {
        margin-bottom: 15px;
      }
      .grid-row:last-child {

      }
      .grid-row:after {

      .tile.tile-position-1-4 {

      .tile.tile-position-2-2 {

      .tile.tile-position-2-3 {

      }

      .tile.tile-position-4-2 {

        0% {
          opacity: 0;
          transform: scale(0);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .tile-new .tile-inner {
        animation: appear 200ms ease 100ms;
        animation-fill-mode: backwards;
      }

      @keyframes pop {
        0% {
          transform: scale(0);
        }

        50% {
          transform: scale(1.2);
        }

        100% {
          transform: scale(1);
        }
      }
      .tile-merged .tile-inner {
        z-index: 20;
        animation: pop 200ms ease 100ms;
        animation-fill-mode: backwards;
      }

        width: 100%;
        margin-top: 16px;

        padding: 0 20px;
        text-decoration: none;
        color: #f9f6f2;

        line-height: 42px;
        text-align: center;

        .game-container .game-message .lower {

        }

  <body>
    <div class="container">
      <div class="heading">
        <div class="scores-container" role="group" aria-label="Scores">
          <div class="score-container" role="status" aria-label="Current score">0</div>
          <div class="best-container" role="status" aria-label="Best score">0</div>
        </div>
      </div>

      <div class="above-game">
        <div class="above-game-controls">
          <select class="theme-select" aria-label="Change tile theme"></select>
          <a class="restart-button" href="#" role="button" aria-label="Start a new game"
            >New Game</a
          >
        </div>
      </div>

      <div class="game-container" role="grid" aria-label="2048 game board">
        <div class="game-message" role="alert" aria-live="assertive" aria-atomic="true">
          <p></p>
          <div class="lower">
            <a
              class="keep-playing-button"
              href="#"
              role="button"
              aria-label="Keep playing after winning"
              >Keep going</a
            >
            <a class="retry-button" href="#" role="button" aria-label="Start a new game"
              >Try again</a
            >
          </div>
        </div>

        <div class="grid-container">
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>
          <div class="grid-row" role="row">
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
            <div class="grid-cell" role="gridcell"></div>
          </div>

        <div class="tile-container" aria-hidden="true"></div>

    <script>
      // ─── js/themes.js ─────────────────────────────────────────
      /**
       * Convert a positive integer to lowercase roman numerals.
       * Used for overflow tiles: "Principal II", "Principal III", etc.
       */
      function toRoman(num) {
        const roman = [
          ["m", 1000],
          ["cm", 900],
          ["d", 500],
          ["cd", 400],
          ["c", 100],
          ["xc", 90],
          ["l", 50],
          ["xl", 40],
          ["x", 10],
          ["ix", 9],
          ["v", 5],
          ["iv", 4],
          ["i", 1],
        ];
        let result = "";
        for (const [letter, value] of roman) {
          while (num >= value) {
            result += letter;
            num -= value;
          }
        }
        return result;
      }

      const THEMES = {
        classic: {
          name: "Classic",
          winThreshold: 2048,

            16: { bg: "#f59563", fg: "#f9f6f2" },

        },

        developer: {

          winThreshold: 64,

            16: { bg: "#818cf8", fg: "#ffffff" },

            64: { bg: "#fbbf24", fg: "#78350f" },
          },
          superColor: { bg: "#1e1b4b", fg: "#fbbf24" },
        },

        agile: {
          name: "Agile",

            2: "Backlog",
            4: "Ticket",
            8: "PR",
            16: "Review",
            32: "Approved",
            64: "Merged",
            128: "Deployed",
          },
          colors: {
            2: { bg: "#e5e7eb", fg: "#374151" },
            4: { bg: "#93c5fd", fg: "#1e3a8a" },
            8: { bg: "#818cf8", fg: "#ffffff" },
            16: { bg: "#c084fc", fg: "#ffffff" },
            32: { bg: "#86efac", fg: "#14532d" },
            64: { bg: "#5eead4", fg: "#134e4a" },
            128: { bg: "#fbbf24", fg: "#78350f" },
          },
          superColor: { bg: "#064e3b", fg: "#fbbf24" },
        },

        fibonacci: {
          name: "Fibonacci",
          winThreshold: 128,
          labels: {

            8: "3",
            16: "5",
            32: "8",
            64: "13",
            128: "21",
          },
          colors: {
            2: { bg: "#eee4da", fg: "#776e65" },
            4: { bg: "#ede0c8", fg: "#776e65" },
            8: { bg: "#f2b179", fg: "#f9f6f2" },
            16: { bg: "#f59563", fg: "#f9f6f2" },
            32: { bg: "#f67c5f", fg: "#f9f6f2" },
            64: { bg: "#f65e3b", fg: "#f9f6f2" },
            128: { bg: "#edcf72", fg: "#f9f6f2" },
          },
          superColor: { bg: "#3c3a32", fg: "#f9f6f2" },
        },
      };

      class ThemeManager {
        constructor() {
          this.themes = THEMES;
          this.storageKey = "2048-theme";
          this.listeners = [];

          const saved = this.loadThemeKey();
          this.currentKey = saved && this.themes[saved] ? saved : "agile";
        }

        get() {
          return this.themes[this.currentKey];
        }

        getKey() {
          return this.currentKey;
        }

        set(key) {
          if (!this.themes[key]) return;
          this.currentKey = key;
          this.saveThemeKey(key);
          this.listeners.forEach((fn) => fn(this.get()));
        }

        onChange(fn) {
          this.listeners.push(fn);
        }

        /**
         * Get the display label for a tile value under the active theme.
         * Values past the last defined label get a roman-numeral suffix:
         * "Principal II", "Principal III", "Principal IV", ...
         */
        getLabel(value) {
          const theme = this.get();
          if (theme.labels[value]) return theme.labels[value];

          const maxKey = Math.max(...Object.keys(theme.labels).map(Number));
          if (value > maxKey) {
            const multiplier = Math.log2(value / maxKey);
            return `${theme.labels[maxKey]} ${toRoman(multiplier + 1)}`;
          }
          return String(value);
        }

        /**
         * Get { bg, fg } colors for a tile value. Values past the last defined
         * color use the theme's superColor.
         */
        getColors(value) {
          const theme = this.get();
          if (theme.colors[value]) return theme.colors[value];
          return theme.superColor;
        }

        loadThemeKey() {
          try {
            return localStorage.getItem(this.storageKey);
          } catch {
            return null;
          }
        }

        saveThemeKey(key) {
          try {
            localStorage.setItem(this.storageKey, key);
          } catch {
            // Storage disabled — theme still works for the session, just won't persist
          }
        }
      }

      const themeManager = new ThemeManager();

      // ─── js/keyboard_input_manager.js ─────────────────────────────────────────
      class KeyboardInputManager {
        constructor() {
          this.events = {};

          this.eventTouchstart = "touchstart";
          this.eventTouchmove = "touchmove";
          this.eventTouchend = "touchend";

          this.listen();
        }

        on(event, callback) {
          if (!this.events[event]) {
            this.events[event] = [];
          }
          this.events[event].push(callback);
        }

        emit(event, data) {
          const callbacks = this.events[event];
          if (callbacks) {
            callbacks.forEach((callback) => callback(data));
          }
        }

        listen() {
          // Map KeyboardEvent.key values to game directions:
          // 0: up, 1: right, 2: down, 3: left
          const keyMap = {
            ArrowUp: 0,
            ArrowRight: 1,
            ArrowDown: 2,
            ArrowLeft: 3,
            k: 0,
            l: 1,
            j: 2,
            h: 3, // Vim keys
            K: 0,
            L: 1,
            J: 2,
            H: 3,
            w: 0,
            d: 1,
            s: 2,
            a: 3, // WASD
            W: 0,
            D: 1,
            S: 2,
            A: 3,
          };

          // Respond to direction keys
          document.addEventListener("keydown", (event) => {
            const modifiers = event.altKey || event.ctrlKey || event.metaKey || event.shiftKey;
            const mapped = keyMap[event.key];

            if (!modifiers) {
              if (mapped !== undefined) {
                event.preventDefault();
                // Ignore auto-repeat key events so holding an arrow doesn't
                // fire a move on every OS key-repeat tick (which would make
                // the game race forward uncontrollably).
                if (event.repeat) return;
                this.emit("move", mapped);
              }

              // R key restarts the game (also ignore repeats here)
              if ((event.key === "r" || event.key === "R") && !event.repeat) {
                this.restart(event);
              }
            }
          });

          // Respond to button presses
          this.bindButtonPress(".retry-button", this.restart);
          this.bindButtonPress(".restart-button", this.restart);
          this.bindButtonPress(".keep-playing-button", this.keepPlaying);

          // Respond to swipe events
          let touchStartClientX, touchStartClientY;
          const gameContainer = document.getElementsByClassName("game-container")[0];

          gameContainer.addEventListener(this.eventTouchstart, (event) => {
            if (event.touches.length > 1 || event.targetTouches.length > 1) {
              return; // Ignore if touching with more than 1 finger
            }

            touchStartClientX = event.touches[0].clientX;
            touchStartClientY = event.touches[0].clientY;

            event.preventDefault();
          });

          gameContainer.addEventListener(this.eventTouchmove, (event) => {
            event.preventDefault();
          });

          gameContainer.addEventListener(this.eventTouchend, (event) => {
            if (event.touches.length > 0 || event.targetTouches.length > 0) {
              return; // Ignore if still touching with one or more fingers
            }

            const touchEndClientX = event.changedTouches[0].clientX;
            const touchEndClientY = event.changedTouches[0].clientY;

            const dx = touchEndClientX - touchStartClientX;
            const absDx = Math.abs(dx);

            const dy = touchEndClientY - touchStartClientY;
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) > 10) {
              // (right : left) : (down : up)
              this.emit("move", absDx > absDy ? (dx > 0 ? 1 : 3) : dy > 0 ? 2 : 0);
            }
          });
        }

        restart(event) {
          event.preventDefault();
          this.emit("restart");
        }

        keepPlaying(event) {
          event.preventDefault();
          this.emit("keepPlaying");
        }

        bindButtonPress(selector, fn) {
          const button = document.querySelector(selector);
          button.addEventListener("click", fn.bind(this));
          button.addEventListener(this.eventTouchend, fn.bind(this));
        }
      }

      // ─── js/grid.js ─────────────────────────────────────────
      class Grid {
        constructor(size, previousState) {
          this.size = size;
          this.cells = previousState ? this.fromState(previousState) : this.empty();
        }

        // Build a grid of the specified size
        empty() {
          const cells = [];
          for (let x = 0; x < this.size; x++) {
            const row = (cells[x] = []);
            for (let y = 0; y < this.size; y++) {
              row.push(null);
            }
          }
          return cells;
        }

        fromState(state) {
          const cells = [];
          for (let x = 0; x < this.size; x++) {
            const row = (cells[x] = []);
            for (let y = 0; y < this.size; y++) {
              const tile = state[x][y];
              row.push(tile ? new Tile(tile.position, tile.value) : null);
            }
          }
          return cells;
        }

        // Find the first available random position
        randomAvailableCell() {
          const cells = this.availableCells();
          if (cells.length) {
            return cells[Math.floor(Math.random() * cells.length)];
          }
        }

        availableCells() {
          const cells = [];
          this.eachCell((x, y, tile) => {
            if (!tile) cells.push({ x, y });
          });
          return cells;
        }

        // Call callback for every cell
        eachCell(callback) {
          for (let x = 0; x < this.size; x++) {
            for (let y = 0; y < this.size; y++) {
              callback(x, y, this.cells[x][y]);
            }
          }
        }

        // Check if there are any cells available
        cellsAvailable() {
          return this.availableCells().length > 0;
        }

        // Check if the specified cell is taken
        cellAvailable(cell) {
          return !this.cellOccupied(cell);
        }

        cellOccupied(cell) {
          return !!this.cellContent(cell);
        }

        cellContent(cell) {
          if (this.withinBounds(cell)) {
            return this.cells[cell.x][cell.y];
          }
          return null;
        }

        // Inserts a tile at its position
        insertTile(tile) {
          this.cells[tile.x][tile.y] = tile;
        }

        removeTile(tile) {
          this.cells[tile.x][tile.y] = null;
        }

        withinBounds(position) {
          return (
            position.x >= 0 && position.x < this.size && position.y >= 0 && position.y < this.size
          );
        }

        serialize() {
          const cellState = [];
          for (let x = 0; x < this.size; x++) {
            const row = (cellState[x] = []);
            for (let y = 0; y < this.size; y++) {
              row.push(this.cells[x][y] ? this.cells[x][y].serialize() : null);
            }
          }
          return { size: this.size, cells: cellState };
        }
      }

      // ─── js/tile.js ─────────────────────────────────────────
      class Tile {
        constructor(position, value) {
          this.x = position.x;
          this.y = position.y;
          this.value = value || 2;

          this.previousPosition = null;
          this.mergedFrom = null; // Tracks tiles that merged together
        }

        savePosition() {
          this.previousPosition = { x: this.x, y: this.y };
        }

        updatePosition(position) {
          this.x = position.x;
          this.y = position.y;
        }

        serialize() {
          return {
            position: { x: this.x, y: this.y },
            value: this.value,
          };
        }
      }

      // ─── js/local_storage_manager.js ─────────────────────────────────────────
      window.fakeStorage = {
        _data: {},

        setItem(id, val) {
          return (this._data[id] = String(val));
        },

        getItem(id) {
          return Object.prototype.hasOwnProperty.call(this._data, id) ? this._data[id] : undefined;
        },

        removeItem(id) {
          return delete this._data[id];
        },

        clear() {
          return (this._data = {});
        },
      };

      class LocalStorageManager {
        constructor() {
          this.bestScoreKey = "bestScore";
          this.gameStateKey = "gameState";

          const supported = this.localStorageSupported();
          this.storage = supported ? window.localStorage : window.fakeStorage;
        }

        localStorageSupported() {
          const testKey = "test";
          try {
            const storage = window.localStorage;
            storage.setItem(testKey, "1");
            storage.removeItem(testKey);
            return true;
          } catch (error) {
            return false;
          }
        }

        // Best score getters/setters
        getBestScore() {
          return this.storage.getItem(this.bestScoreKey) || 0;
        }

        setBestScore(score) {
          this.storage.setItem(this.bestScoreKey, score);
        }

        // Game state getters/setters and clearing
        getGameState() {
          const stateJSON = this.storage.getItem(this.gameStateKey);
          if (!stateJSON) return null;
          try {
            return JSON.parse(stateJSON);
          } catch (error) {
            // Corrupted state — clear it so the game starts fresh instead of crashing
            this.clearGameState();
            return null;
          }
        }

        setGameState(gameState) {
          try {
            this.storage.setItem(this.gameStateKey, JSON.stringify(gameState));
          } catch (error) {
            // Quota exceeded or storage disabled — silently drop the save
            this.clearGameState();
          }
        }

        clearGameState() {
          this.storage.removeItem(this.gameStateKey);
        }
      }

      // ─── js/html_actuator.js ─────────────────────────────────────────
      class HTMLActuator {
        constructor(themeManagerRef) {
          this.themeManager = themeManagerRef;
          this.tileContainer = document.querySelector(".tile-container");
          this.scoreContainer = document.querySelector(".score-container");
          this.bestContainer = document.querySelector(".best-container");
          this.messageContainer = document.querySelector(".game-message");

          this.score = 0;
        }

        actuate(grid, metadata) {
          window.requestAnimationFrame(() => {
            this.clearContainer(this.tileContainer);

            grid.cells.forEach((column) => {
              column.forEach((cell) => {
                if (cell) this.addTile(cell);
              });
            });

            this.updateScore(metadata.score);
            this.updateBestScore(metadata.bestScore);

            if (metadata.terminated) {
              if (metadata.over) {
                this.message(false); // You lose
              } else if (metadata.won) {
                this.message(true); // You win!
              }
            }
          });
        }

        // Continues the game (both restart and keep playing)
        continueGame() {
          this.clearMessage();
        }

        clearContainer(container) {
          while (container.firstChild) {
            container.removeChild(container.firstChild);
          }
        }

        addTile(tile) {
          const wrapper = document.createElement("div");
          const inner = document.createElement("div");
          const position = tile.previousPosition || { x: tile.x, y: tile.y };
          const positionClass = this.positionClass(position);

          const classes = ["tile", `tile-${tile.value}`, positionClass];
          if (tile.value > 2048) classes.push("tile-super");

          this.applyClasses(wrapper, classes);

          inner.classList.add("tile-inner");

          const label = this.themeManager.getLabel(tile.value);
          const colors = this.themeManager.getColors(tile.value);
          inner.textContent = label;
          inner.style.backgroundColor = colors.bg;
          inner.style.color = colors.fg;
          inner.style.setProperty("--tile-font-size", `${this.fontSizeForLabel(label)}px`);

          if (tile.previousPosition) {
            // Make sure that the tile gets rendered in the previous position first
            window.requestAnimationFrame(() => {
              classes[2] = this.positionClass({ x: tile.x, y: tile.y });
              this.applyClasses(wrapper, classes); // Update the position
            });
          } else if (tile.mergedFrom) {
            classes.push("tile-merged");
            this.applyClasses(wrapper, classes);

            // Render the tiles that merged
            tile.mergedFrom.forEach((merged) => this.addTile(merged));
          } else {
            classes.push("tile-new");
            this.applyClasses(wrapper, classes);
          }

          // Add the inner part of the tile to the wrapper
          wrapper.appendChild(inner);

          // Put the tile on the board
          this.tileContainer.appendChild(wrapper);
        }

        applyClasses(element, classes) {
          element.setAttribute("class", classes.join(" "));
        }

        /**
         * Pick a font size (in px) that fits the tile width based on label length.
         * Desktop tiles are 107px wide; these sizes are tuned so the longest
         * labels ("Principal", "Deployed", "Principal II") still fit on one line.
         * Mobile scales them down to ~55% via the CSS media query.
         */
        fontSizeForLabel(label) {
          const len = label.length;
          if (len <= 2) return 55; // "2", "64", "Mid", "PR", "13", "21"
          if (len <= 3) return 45; // "128", "256", "512"
          if (len <= 4) return 35; // "1024", "2048"
          if (len <= 5) return 28; // "Staff"
          if (len <= 6) return 24; // "Intern", "Junior", "Senior", "Review", "Merged"
          if (len <= 7) return 20; // "Backlog"
          if (len <= 9) return 18; // "Principal", "Approved", "Deployed"
          return 15; // "Principal II", "Principal III"
        }

        normalizePosition(position) {
          return { x: position.x + 1, y: position.y + 1 };
        }

        positionClass(position) {
          const normalized = this.normalizePosition(position);
          return `tile-position-${normalized.x}-${normalized.y}`;
        }

        updateScore(score) {
          this.clearContainer(this.scoreContainer);

          const difference = score - this.score;
          this.score = score;

          this.scoreContainer.textContent = this.score;

          if (difference > 0) {
            const addition = document.createElement("div");
            addition.classList.add("score-addition");
            addition.textContent = `+${difference}`;
            // The animation is decorative; screen readers using role="status"
            // would otherwise announce "4 plus 2" on every move.
            addition.setAttribute("aria-hidden", "true");
            this.scoreContainer.appendChild(addition);
          }
        }

        updateBestScore(bestScore) {
          this.bestContainer.textContent = bestScore;
        }

        message(won) {
          const type = won ? "game-won" : "game-over";
          const message = won ? "You win!" : "Game over!";

          this.messageContainer.classList.add(type);
          const messageParagraph = this.messageContainer.getElementsByTagName("p")[0];
          messageParagraph.textContent = message;
          // Ensure the live region re-announces even if the message text is
          // identical to a previous announcement (e.g. game over twice in a row).
          this.messageContainer.setAttribute("aria-live", "assertive");
        }

        clearMessage() {
          this.messageContainer.classList.remove("game-won", "game-over");
        }
      }

      // ─── js/game_manager.js ─────────────────────────────────────────
      class GameManager {
        constructor(size, InputManager, Actuator, StorageManager) {
          this.size = size; // Size of the grid
          this.inputManager = new InputManager();
          this.storageManager = new StorageManager();
          this.actuator = new Actuator(themeManager);

          this.startTiles = 2;
          this.winThreshold = themeManager.get().winThreshold;

          this.inputManager.on("move", this.move.bind(this));
          this.inputManager.on("restart", this.restart.bind(this));
          this.inputManager.on("keepPlaying", this.keepPlaying.bind(this));

          themeManager.onChange((theme) => {
            this.winThreshold = theme.winThreshold;
            this.actuate();
          });

          this.setup();
        }

        // Restart the game
        restart() {
          this.storageManager.clearGameState();
          this.actuator.continueGame(); // Clear the game won/lost message
          this.setup();
        }

        // Keep playing after winning (allows going over 2048)
        keepPlaying() {
          this.keepPlayingEnabled = true;
          this.actuator.continueGame(); // Clear the game won/lost message
        }

        // Return true if the game is lost, or has won and the user hasn't kept playing
        isGameTerminated() {
          return this.over || (this.won && !this.keepPlayingEnabled);
        }

        // Set up the game
        setup() {
          const previousState = this.storageManager.getGameState();

          // Reload the game from a previous game if present
          if (previousState) {
            this.grid = new Grid(previousState.grid.size, previousState.grid.cells);
            this.score = previousState.score;
            this.over = previousState.over;
            this.won = previousState.won;
            this.keepPlayingEnabled =
              previousState.keepPlayingEnabled || previousState.keepPlaying || false;
          } else {
            this.grid = new Grid(this.size);
            this.score = 0;
            this.over = false;
            this.won = false;
            this.keepPlayingEnabled = false;

            // Add the initial tiles
            this.addStartTiles();
          }

          // Update the actuator
          this.actuate();
        }

        // Set up the initial tiles to start the game with
        addStartTiles() {
          for (let i = 0; i < this.startTiles; i++) {
            this.addRandomTile();
          }
        }

        // Adds a tile in a random position
        addRandomTile() {
          if (this.grid.cellsAvailable()) {
            const value = Math.random() < 0.9 ? 2 : 4;
            const tile = new Tile(this.grid.randomAvailableCell(), value);
            this.grid.insertTile(tile);
          }
        }

        // Sends the updated grid to the actuator
        actuate() {
          if (this.storageManager.getBestScore() < this.score) {
            this.storageManager.setBestScore(this.score);
          }

          // Clear the state when the game is over (game over only, not win)
          if (this.over) {
            this.storageManager.clearGameState();
          } else {
            this.storageManager.setGameState(this.serialize());
          }

          this.actuator.actuate(this.grid, {
            score: this.score,
            over: this.over,
            won: this.won,
            bestScore: this.storageManager.getBestScore(),
            terminated: this.isGameTerminated(),
          });
        }

        // Represent the current game as an object
        serialize() {
          return {
            grid: this.grid.serialize(),
            score: this.score,
            over: this.over,
            won: this.won,
            keepPlayingEnabled: this.keepPlayingEnabled,
          };
        }

        // Save all tile positions and remove merger info
        prepareTiles() {
          this.grid.eachCell((x, y, tile) => {
            if (tile) {
              tile.mergedFrom = null;
              tile.savePosition();
            }
          });
        }

        // Move a tile and its representation
        moveTile(tile, cell) {
          this.grid.cells[tile.x][tile.y] = null;
          this.grid.cells[cell.x][cell.y] = tile;
          tile.updatePosition(cell);
        }

        // Move tiles on the grid in the specified direction
        move(direction) {
          // 0: up, 1: right, 2: down, 3: left
          if (this.isGameTerminated()) return; // Don't do anything if the game's over

          const vector = this.getVector(direction);
          const traversals = this.buildTraversals(vector);
          let moved = false;

          // Save the current tile positions and remove merger information
          this.prepareTiles();

          // Traverse the grid in the right direction and move tiles
          traversals.x.forEach((x) => {
            traversals.y.forEach((y) => {
              const cell = { x, y };
              const tile = this.grid.cellContent(cell);

              if (tile) {
                const positions = this.findFarthestPosition(cell, vector);
                const next = this.grid.cellContent(positions.next);

                // Only one merger per row traversal?
                if (next && next.value === tile.value && !next.mergedFrom) {
                  const merged = new Tile(positions.next, tile.value * 2);
                  merged.mergedFrom = [tile, next];

                  this.grid.insertTile(merged);
                  this.grid.removeTile(tile);

                  // Converge the two tiles' positions
                  tile.updatePosition(positions.next);

                  // Update the score
                  this.score += merged.value;

                  // The mighty 2048 tile
                  if (merged.value === this.winThreshold) this.won = true;
                } else {
                  this.moveTile(tile, positions.farthest);
                }

                if (!this.positionsEqual(cell, tile)) {
                  moved = true; // The tile moved from its original cell!
                }
              }
            });
          });

          if (moved) {
            this.addRandomTile();

            if (!this.movesAvailable()) {
              this.over = true; // Game over!
            }

            this.actuate();
          }
        }

        // Get the vector representing the chosen direction
        getVector(direction) {
          // Vectors representing tile movement
          const map = {
            0: { x: 0, y: -1 }, // Up
            1: { x: 1, y: 0 }, // Right
            2: { x: 0, y: 1 }, // Down
            3: { x: -1, y: 0 }, // Left
          };
          return map[direction];
        }

        // Build a list of positions to traverse in the right order
        buildTraversals(vector) {
          const traversals = { x: [], y: [] };
          for (let pos = 0; pos < this.size; pos++) {
            traversals.x.push(pos);
            traversals.y.push(pos);
          }

          // Always traverse from the farthest cell in the chosen direction
          if (vector.x === 1) traversals.x = traversals.x.reverse();
          if (vector.y === 1) traversals.y = traversals.y.reverse();

          return traversals;
        }

        findFarthestPosition(cell, vector) {
          let previous;
          let current = cell;

          // Progress towards the vector direction until an obstacle is found
          do {
            previous = current;
            current = { x: previous.x + vector.x, y: previous.y + vector.y };
          } while (this.grid.withinBounds(current) && this.grid.cellAvailable(current));

          return {
            farthest: previous,
            next: current, // Used to check if a merge is required
          };
        }

        movesAvailable() {
          return this.grid.cellsAvailable() || this.tileMatchesAvailable();
        }

        // Check for available matches between tiles (more expensive check)
        tileMatchesAvailable() {
          for (let x = 0; x < this.size; x++) {
            for (let y = 0; y < this.size; y++) {
              const tile = this.grid.cellContent({ x, y });

              if (tile) {
                for (let direction = 0; direction < 4; direction++) {
                  const vector = this.getVector(direction);
                  const cell = { x: x + vector.x, y: y + vector.y };
                  const other = this.grid.cellContent(cell);

                  if (other && other.value === tile.value) {
                    return true; // These two tiles can be merged
                  }
                }
              }
            }
          }
          return false;
        }

        positionsEqual(first, second) {
          return first.x === second.x && first.y === second.y;
        }
      }

      // ─── js/application.js ─────────────────────────────────────────
      // Wait till the browser is ready to render the game (avoids glitches)
      window.requestAnimationFrame(() => {
        new GameManager(4, KeyboardInputManager, HTMLActuator, LocalStorageManager);

        const select = document.querySelector(".theme-select");
        if (select) {
          const themes = themeManager.themes;
          for (const key of Object.keys(themes)) {
            const option = document.createElement("option");
            option.value = key;
            option.textContent = themes[key].name;
            select.appendChild(option);
          }
          select.value = themeManager.getKey();
          select.addEventListener("change", () => {
            themeManager.set(select.value);
          });
        }
      });
    </script>
  </body>
</html>
