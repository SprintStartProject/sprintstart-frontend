name: Mutation testing

# On a PR: the files it changed must have a mutation score of at least MUTATION_MIN.
# Nightly: the whole frontend, as a report for the quality trend (never fails).

on:
  pull_request:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - uses: ./.github/actions/node-exit-safe

      - run: npm ci

      - name: Mutation gate on changed files
        if: github.event_name == 'pull_request'
        run: bash scripts/quality/mutation.sh "origin/${{ github.base_ref }}"

      - name: Mutation report on the whole frontend
        if: github.event_name != 'pull_request'
        run: bash scripts/quality/mutation.sh --all "origin/${{ github.event.repository.default_branch }}"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
